site_name: libamcore
site_description: Portable C computational routines for antenna measurements
site_url: https://antennameasurement.github.io/libamcore/
repo_url: https://github.com/AntennaMeasurement/libamcore
repo_name: AntennaMeasurement/libamcore

docs_dir: docs/public
exclude_docs: LLM_CONTEXT.md

theme:
  name: readthedocs

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Build and install: getting-started.md
  - C API: api.md
  - Command-line interface: cli.md
  - CMake integration: cmake-integration.md
  - WebAssembly: webassembly.md

strict: true
